# Frontier Scout editorial configuration.
# Change monitored sources and scoring opinion here, never in Python.

pipeline:
  # How many concept groups pass the gate into the expensive LLM stage.
  # Everything before the gate is free; everything after costs money.
  gate_width: 12
  max_concurrent_calls: 12
  backfill_days: 90
  daily_llm_budget_usd: 15.0
  min_mentions_to_track: 2          # below this a concept is noise
  candidates_per_cluster: 3
  pairwise_top_n: 10
  red_team_top_n: 5
  brief_signal_count: 12            # 5-15 signals per daily brief

# Which provider the agent layer uses: anthropic | deepseek | auto.
# 'auto' takes whichever key is present, Anthropic first.
llm:
  provider: deepseek

# Anthropic model map (used when provider resolves to anthropic).
models:
  scout: claude-sonnet-5
  generator: claude-opus-5
  evaluator: claude-sonnet-5
  pairwise: claude-sonnet-5
  red_team: claude-sonnet-5
  clusterer: claude-opus-5

# DeepSeek model map. deepseek-flash is roughly 4x cheaper than v4-pro, so
# high-volume extraction and the pairwise tournament run on flash while
# judgement and generation run on pro.
#
# NOTE: DeepSeek does NOT support server-side schema enforcement
# (response_format json_schema returns 400), so the schema is injected into the
# prompt and validated client-side by the runner's repair loop.
deepseek_models:
  scout: deepseek-flash
  clusterer: deepseek-v4-pro
  translator: deepseek-v4-pro
  generator: deepseek-v4-pro
  evaluator: deepseek-v4-pro
  pairwise: deepseek-flash
  red_team: deepseek-v4-pro

# NOTE ON TEMPERATURE.
# The original plan was "low temperature for extraction, higher for generation".
# That is no longer expressible: current models (Opus 5, Sonnet 5, Opus 4.7/4.8,
# Fable) REJECT `temperature` with a 400 error. `output_config.effort` is the
# replacement lever -- it controls how much the model thinks and spends.
#
# So: cheap, mechanical work runs at lower effort; the judgement-heavy and
# generative stages get more. Temperature is still sent to older models that
# accept it (see SAMPLING_MODELS in llm/anthropic_provider.py), which is why
# the legacy block is kept below rather than deleted.
effort:
  scout: medium
  clusterer: high
  translator: high
  generator: high
  evaluator: medium
  pairwise: medium
  red_team: medium

legacy_temperature:
  # Applied on models that accept sampling parameters. DeepSeek does, so on
  # DeepSeek these are live and the original low-for-extraction /
  # high-for-generation plan works as originally intended.
  scout: 0.2
  clusterer: 0.3
  translator: 0.8
  generator: 0.9
  evaluator: 0.0
  pairwise: 0.0
  red_team: 0.2

# INSIDER_MOMENTUM component weights. Not sacred -- every component is stored
# separately in concept_metrics so these can be refit against video outcomes.
momentum_weights:
  normalized_velocity: 0.30
  unique_author_growth: 0.20
  cross_platform_presence: 0.15
  respected_source_presence: 0.15
  engagement_acceleration: 0.10
  novelty: 0.10

# EDITORIAL_OPPORTUNITY is a weighted geometric mean of these, times a
# coverage adjustment. Geometric so that a near-zero on any dimension
# collapses the score: a huge trend with no consequence is not a video.
opportunity_weights:
  insider_momentum: 0.20
  consequence: 0.25
  public_confusion: 0.20
  story_potential: 0.15
  technical_substance: 0.20

scoring:
  velocity_cap: 10.0            # log-squash cap for ratio components
  baseline_window_days: 28
  baseline_exclude_recent_days: 3
  min_baseline_days: 14         # below this, velocity is INSUFFICIENT_HISTORY
  novelty_horizon_days: 180
  independence_exponent: 0.5    # momentum *= independence_ratio ** this
  coverage_penalty: 0.7         # opportunity *= 1 - penalty*saturation

# X is OFF BY DEFAULT. X has no free tier: reads are billed per returned
# resource (~$0.005/post), so a careless config spends real money. Enabling
# this without setting the budget ceilings is refused by the connector.
x:
  enabled: false
  max_results_per_query: 50
  daily_budget_usd: 2.00
  monthly_budget_usd: 40.00
  # Endpoint availability differs by account. The connector probes these at
  # startup and records what it actually got rather than assuming.
  endpoints:
    recent_search: true
    full_archive_search: false    # typically Enterprise-gated
    user_timeline: true

youtube:
  enabled: true                   # no-ops without YOUTUBE_API_KEY
  # search.list is capped at 100 calls/day, SEPARATE from the 10,000-unit pool.
  # This is the scarcest quota in the system, so coverage runs after the gate.
  max_search_calls_per_day: 60
  search_orders: [relevance, viewCount, date]
  results_per_search: 15
  cache_days: 7

google_trends:
  # The OFFICIAL Google Trends API is alpha and application-gated. This path
  # uses SerpAPI instead, which supplies the same Trends data commercially.
  # Values are labelled serpapi_google_trends so no brief implies we hold
  # first-party Google data.
  #
  # Public interest stays SEPARATE from insider momentum. A concept insiders
  # are converging on while public search stays flat is the opportunity we
  # want, so this never feeds INSIDER_MOMENTUM.
  enabled: true
  # SerpAPI bills per search against a monthly quota, so this is capped per
  # run and cached for days -- Trends is weekly data.
  max_searches_per_run: 8
  cache_days: 3
