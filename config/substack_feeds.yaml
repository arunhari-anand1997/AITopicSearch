# Curated newsletters. Public RSS only; paywalled bodies are never bypassed.
# curated_tier: 1 = highly respected in-domain, 2 = solid, 3 = watchlist.
# Tier drives respected_source_presence. It is set by the editor here and is
# never invented by a model.
feeds:
