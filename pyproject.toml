[project]
name = "frontier-scout"
version = "0.1.0"
description = "Live editorial intelligence for discovering high-potential documentary topics at the technological frontier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
frontier-scout = "frontier_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontier_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
